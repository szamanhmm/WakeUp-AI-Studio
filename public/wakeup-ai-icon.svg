<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100" height="100">
  <defs>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="iconCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="#040714" stroke="rgba(0, 245, 212, 0.25)" stroke-width="1.5" />
  
  <!-- Cyan Neon 'W' -->
  <path d="M 12 32 L 28 68 L 40 40 L 52 68 L 66 32" 
        stroke="url(#iconCyanGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#iconGlow)" />
  
  <path d="M 12 32 L 28 68 L 40 40 L 52 68 L 66 32" 
        stroke="#ffffff" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        opacity="0.85" />

  <!-- Bold White 'A' with Cyan Pillar -->
  <path d="M 68 68 L 81 32 L 94 68" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
        
  <line x1="81" y1="48" x2="81" y2="68" 
        stroke="#00f5d4" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#iconGlow)" />
</svg>
