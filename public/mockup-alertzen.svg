
  <svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="cyberNight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#050814"/>
        <stop offset="50%" stop-color="#0a102a"/>
        <stop offset="100%" stop-color="#030611"/>
      </linearGradient>
      <linearGradient id="neonBluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="50%" stop-color="#818CF8"/>
        <stop offset="100%" stop-color="#C084FC"/>
      </linearGradient>
      <radialGradient id="bellGlow" cx="60%" cy="40%" r="50%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
        <stop offset="60%" stop-color="#818CF8" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
      </radialGradient>
      <filter id="zenShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="25" stdDeviation="32" flood-color="#000000" flood-opacity="0.9"/>
      </filter>
    </defs>

    <!-- Cyber Night Canvas -->
    <rect width="800" height="1200" fill="url(#cyberNight)"/>

    <!-- Glowing Bell Aura in Upper Right -->
    <circle cx="580" cy="240" r="280" fill="url(#bellGlow)"/>
    <circle cx="580" cy="240" r="180" fill="none" stroke="#818CF8" stroke-width="2.5" opacity="0.4" stroke-dasharray="12 6"/>

    <!-- Header & Logo -->
    <g transform="translate(60, 60)">
      <rect width="64" height="64" rx="18" fill="#0E1738" stroke="#38BDF8" stroke-width="2.5"/>
      <path d="M32 18 C26 18 22 23 22 30 L22 40 L16 46 L48 46 L42 40 L42 30 C42 23 38 18 32 18 Z" fill="#38BDF8"/>
      <circle cx="32" cy="50" r="4" fill="#C084FC"/>
      <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
      <text x="85" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">AlertZen</text>
      <text x="85" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#818CF8">Notification Alarm</text>
    </g>

    <!-- Top Right Script -->
    <text x="740" y="85" text-anchor="end" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="22" fill="#38BDF8">
      Your Important Notifications. Always Heard.
    </text>

    <!-- Big Gradient Headline -->
    <g transform="translate(60, 190)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF">Never Miss</text>
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#neonBluePurple)">What Matters!</text>
      
      <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38BDF8">
        Set custom rules for critical notification alarms.
      </text>

      <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94A3B8" width="340">
        <tspan x="0" dy="0">Stop drowning in notification noise.</tspan>
        <tspan x="0" dy="25">AlertZen helps you reclaim focus by</tspan>
        <tspan x="0" dy="25">converting critical notifications into</tspan>
        <tspan x="0" dy="25">unmissable alarms, silencing the clutter.</tspan>
      </text>
    </g>

    <!-- Feature Pillars -->
    <g transform="translate(60, 420)">
      <!-- 1. Custom Trigger Rules -->
      <g transform="translate(0, 0)">
        <rect width="56" height="56" rx="14" fill="#0E1738" stroke="#38BDF8" stroke-width="2"/>
        <path d="M28 16 C23 16 19 20 19 26 L19 34 L15 39 L41 39 L37 34 L37 26 C37 20 33 16 28 16 Z" fill="#38BDF8"/>
        <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Custom Trigger Rules</text>
        <text x="75" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Rules by app, title or keyword</text>
      </g>

      <!-- 2. DND Override -->
      <g transform="translate(0, 85)">
        <rect width="56" height="56" rx="14" fill="#0E1738" stroke="#818CF8" stroke-width="2"/>
        <path d="M34 16 A12 12 0 1 1 20 38 A15 15 0 0 0 34 16 Z" fill="#818CF8"/>
        <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">DND Override</text>
        <text x="75" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Hear sirens even in Silent or Do Not Disturb</text>
      </g>

      <!-- 3. Smart Insights -->
      <g transform="translate(0, 170)">
        <rect width="56" height="56" rx="14" fill="#0E1738" stroke="#C084FC" stroke-width="2"/>
        <rect x="18" y="32" width="5" height="12" rx="2" fill="#C084FC"/>
        <rect x="26" y="24" width="5" height="20" rx="2" fill="#C084FC"/>
        <rect x="34" y="16" width="5" height="28" rx="2" fill="#C084FC"/>
        <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Smart Insights</text>
        <text x="75" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Track trends &amp; top sender analytics</text>
      </g>

      <!-- 4. Offline-First Privacy -->
      <g transform="translate(0, 255)">
        <rect width="56" height="56" rx="14" fill="#0E1738" stroke="#38BDF8" stroke-width="2"/>
        <path d="M28 16 L40 22 L40 32 C40 40 28 46 28 46 C28 46 16 40 16 32 L16 22 Z" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
        <path d="M24 30 L27 33 L32 27" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
        <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Offline-First Privacy</text>
        <text x="75" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">100% on-device &amp; encrypted</text>
      </g>

      <!-- 5. Zen Automation -->
      <g transform="translate(0, 340)">
        <rect width="56" height="56" rx="14" fill="#0E1738" stroke="#F43F5E" stroke-width="2"/>
        <circle cx="28" cy="28" r="8" fill="#F43F5E"/>
        <text x="75" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Zen Automation</text>
        <text x="75" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Quiet hours &amp; wellness intervals</text>
      </g>
    </g>

    <!-- SMARTPHONE MOCKUP (Right Side) -->
    <g transform="translate(420, 240)" filter="url(#zenShadow)">
      <!-- Bezel -->
      <rect width="340" height="720" rx="46" fill="#0b0f19" stroke="#1e293b" stroke-width="4"/>
      <!-- Screen -->
      <rect x="8" y="8" width="324" height="704" rx="38" fill="#040714"/>

      <!-- Dynamic Island -->
      <rect x="115" y="20" width="94" height="20" rx="10" fill="#000000"/>

      <!-- App Header inside phone -->
      <g transform="translate(24, 65)">
        <text x="0" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">10:45</text>
        <text x="276" y="16" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">5G 📶</text>
        <text x="0" y="48" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">AlertZen</text>
      </g>

      <!-- Monitoring Active Toggle -->
      <g transform="translate(24, 130)">
        <rect width="276" height="55" rx="16" fill="#0B132B" stroke="#1D2D5B" stroke-width="1.5"/>
        <circle cx="25" cy="28" r="5" fill="#10B981"/>
        <text x="40" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Active</text>
        <text x="40" y="40" font-family="sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Monitoring your notifications</text>
        <!-- Toggle Switch ON -->
        <rect x="215" y="15" width="46" height="26" rx="13" fill="#10B981"/>
        <circle cx="248" cy="28" r="10" fill="#FFFFFF"/>
      </g>

      <!-- 3 Small KPI Stats Cards -->
      <g transform="translate(24, 200)">
        <rect width="86" height="70" rx="14" fill="#0E1738"/>
        <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Received</text>
        <text x="14" y="54" font-family="sans-serif" font-size="22" font-weight="900" fill="#38BDF8">128</text>

        <g transform="translate(95, 0)">
          <rect width="86" height="70" rx="14" fill="#0E1738"/>
          <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#F43F5E">Critical</text>
          <text x="14" y="54" font-family="sans-serif" font-size="22" font-weight="900" fill="#F43F5E">12</text>
        </g>

        <g transform="translate(190, 0)">
          <rect width="86" height="70" rx="14" fill="#0E1738"/>
          <text x="10" y="24" font-family="sans-serif" font-size="9" font-weight="600" fill="#10B981">Top Sender</text>
          <text x="10" y="52" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">WhatsApp</text>
        </g>
      </g>

      <!-- Recent Activity Feed inside Phone -->
      <g transform="translate(24, 290)">
        <text x="0" y="0" font-family="sans-serif" font-size="12" font-weight="800" fill="#94A3B8">Recent Activity</text>
        <text x="276" y="0" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8">View All →</text>

        <!-- Feed item 1: WhatsApp -->
        <g transform="translate(0, 15)">
          <rect width="276" height="54" rx="14" fill="#0C1530"/>
          <circle cx="28" cy="27" r="14" fill="#25D366"/>
          <text x="52" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#25D366">WhatsApp</text>
          <text x="52" y="42" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Family Emergency</text>
          <text x="260" y="28" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">10:42 AM</text>
        </g>

        <!-- Feed item 2: Gmail -->
        <g transform="translate(0, 78)">
          <rect width="276" height="54" rx="14" fill="#0C1530"/>
          <circle cx="28" cy="27" r="14" fill="#EA4335"/>
          <text x="52" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#EA4335">Gmail</text>
          <text x="52" y="42" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Project Update</text>
          <text x="260" y="28" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">09:58 AM</text>
        </g>

        <!-- Feed item 3: Slack -->
        <g transform="translate(0, 141)">
          <rect width="276" height="54" rx="14" fill="#0C1530"/>
          <circle cx="28" cy="27" r="14" fill="#4A154B"/>
          <text x="52" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#E01E5A">Slack</text>
          <text x="52" y="42" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Server Alert</text>
          <text x="260" y="28" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">09:32 AM</text>
        </g>

        <!-- Feed item 4: Phone -->
        <g transform="translate(0, 204)">
          <rect width="276" height="54" rx="14" fill="#0C1530"/>
          <circle cx="28" cy="27" r="14" fill="#0284C7"/>
          <text x="52" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Phone</text>
          <text x="52" y="42" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Missed Call</text>
          <text x="260" y="28" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">08:17 AM</text>
        </g>
      </g>

      <!-- Bottom Nav inside phone -->
      <g transform="translate(24, 660)">
        <text x="25" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#38BDF8">Home</text>
        <text x="85" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">Rules</text>
        <text x="145" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">History</text>
        <text x="205" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">Insights</text>
        <text x="260" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b">More</text>
      </g>
    </g>

    <!-- Bottom Strip -->
    <g transform="translate(60, 1100)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#1E293B" stroke-width="1.5"/>
      <g transform="translate(10, 45)">
        <text x="0" y="0" font-family="sans-serif" font-size="15" font-weight="800" fill="#38BDF8">⏰ History Log</text>
        <text x="160" y="0" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">📄 JSON Export</text>
        <text x="330" y="0" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">📱 Home Widget</text>
        <text x="510" y="0" font-family="sans-serif" font-size="15" font-weight="800" fill="#A855F7">👑 No Subscriptions</text>
      </g>
    </g>
  </svg>
  